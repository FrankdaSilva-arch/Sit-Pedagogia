<input type="text" id="nome_do_curso" name="nome_do_curso" autocomplete="off" class="form-control">
<div id="autocomplete-list" class="autocomplete-items"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const input = document.getElementById("nome_do_curso");
    const list = document.getElementById("autocomplete-list");

    if (!input) {
        console.log("Campo #nome_do_curso não encontrado!");
        return;
    }
    if (!list) {
        console.log("Div #autocomplete-list não encontrada!");
        return;
    }

    input.addEventListener("input", function() {
        const query = this.value;
        console.log("Usuário digitou:", query);

        if (query.length === 0) {
            list.innerHTML = "";
            console.log("Campo vazio, limpando sugestões.");
            return;
        }
        const url = `/eventos/autocomplete/cursos/?q=${encodeURIComponent(query)}`;
        console.log("Buscando sugestões em:", url);

        fetch(url)
            .then(response => {
                console.log("Resposta recebida do backend:", response);
                return response.json();
            })
            .then(data => {
                console.log("Sugestões recebidas:", data);
                list.innerHTML = "";
                data.forEach(function(item) {
                    const div = document.createElement("div");
                    div.textContent = item;
                    div.classList.add("autocomplete-suggestion");
                    div.onclick = function() {
                        input.value = item;
                        list.innerHTML = "";
                        console.log("Sugestão selecionada:", item);
                    };
                    list.appendChild(div);
                });
            })
            .catch(error => {
                console.error("Erro ao buscar sugestões:", error);
            });
    });

    // Fechar sugestões ao clicar fora
    document.addEventListener("click", function(e) {
        if (e.target !== input) {
            list.innerHTML = "";
        }
    });
});
</script>
<style>
.autocomplete-items {
    border: 1px solid #d4d4d4;
    max-height: 200px;
    overflow-y: auto;
    position: absolute;
    background: #fff;
    z-index: 1000;
    width: 100%;
}
.autocomplete-suggestion {
    padding: 8px;
    cursor: pointer;
}
.autocomplete-suggestion:hover {
    background: #e9e9e9;
}
</style>
