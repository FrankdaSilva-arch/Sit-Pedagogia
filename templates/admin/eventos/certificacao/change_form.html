{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
    {{ block.super }}
    {% if editor_url %}
    <div class="submit-row" style="margin-top:20px; padding:15px; background:#f8f8f8; border:1px solid #ddd; border-radius:5px;">
        <h3 style="margin-bottom:15px; color:#417690;">🎓 Certificados</h3>
        <a href="{{ editor_url }}"
           style="background:#27ae60; color:white; padding:10px 20px; border-radius:4px; text-decoration:none; margin-right:10px; font-size:14px;">
            🎨 Abrir Editor Visual
        </a>
        <a href="{{ gerar_url_jpg }}"
           style="background:#417690; color:white; padding:10px 20px; border-radius:4px; text-decoration:none; margin-right:10px; font-size:14px;">
            🖼️ Baixar ZIP com Imagens (JPG)
        </a>
        <a href="{{ gerar_url_pdf }}"
           style="background:#c0392b; color:white; padding:10px 20px; border-radius:4px; text-decoration:none; font-size:14px;">
            📄 Baixar ZIP com PDFs
        </a>
    </div>
    {% endif %}
{% endblock %}
